name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ['1.9', '1.10', '1.11', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - name: Run tests
        run: julia test/runtests.jl
      - name: Smoke test examples
        run: |
          julia examples/basic_training.jl
          julia examples/byte_level.jl
          julia examples/custom_tokenizer.jl
          julia examples/multilingual.jl
          julia examples/streaming_encode.jl
          julia examples/training_comparison.jl
          julia examples/nlp_pipeline.jl
